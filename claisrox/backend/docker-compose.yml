services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: claisrox
      POSTGRES_PASSWORD: claisrox
      POSTGRES_DB: claisrox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claisrox"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claisrox:claisrox@db:5432/claisrox
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
