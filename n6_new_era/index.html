<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="N6 New Era — dashboard operasional NUMBER SIX.">
<meta name="robots" content="noindex, nofollow">
<title>N6</title>
<link rel="icon" href="assets/images/logo-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* Splash boot inline: harus terlihat sebelum stylesheet termuat. */
  html, body { margin: 0; padding: 0; background: #F5F3EE; }
  .n6-boot { min-height: 100vh; display: flex; align-items: center;
    justify-content: center; font-family: system-ui, sans-serif; color: #111110; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #14243c; }
  html[data-theme="dark"] .n6-boot { color: #F5F3EE; }
</style>
<script>
  /* Set tema sebelum splash dirender agar tidak flash di dark mode. */
  try {
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="n6-boot" id="n6-boot">Memuat N6…</div>
<div id="app" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
